[package]
name = "koin"
version = "0.4.7"
description = "个人账单可视化工具"
authors = ["AprIsYourLie"]
edition = "2021"

[lib]
name = "koin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
